services:
  condor:
    image: ${CONDOR_IMAGE:?Set an immutable image digest built from this repository}
    init: true
    restart: unless-stopped
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    environment:
      CONDOR_MODE: local
      ADMIN_USER_ID: ${ADMIN_USER_ID:?Choose the native local admin identity before startup}
      WEB_HOST: 127.0.0.1
      WEB_PORT: "8088"
      WEB_URL: http://localhost:8088
      CONDOR_TELEMETRY: "off"
      CONDOR_SHARING: "off"
    volumes:
      - condor-state:/var/lib/condor
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  condor-state:
